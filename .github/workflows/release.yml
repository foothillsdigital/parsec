name: release

# A release starts with a signed tag pushed to a v* name. The tag's
# signature is checked first, the crate is built twice and must come out
# the same, and only then is it attested and published. A manual run does
# all but the tag check and the publishing, to try a release first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Against the signers on main, not the tagged commit's: someone who
      # can push a tag could also change the file it would be checked with.
      # The annotated tag is fetched again by name, so `git tag -v` sees
      # its signature, not a lightweight ref to the commit.
      - name: The tag is signed by a maintainer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG" refs/heads/main:refs/remotes/origin/main
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git tag -v "$TAG"

  build:
    needs: [tag]
    # A manual run skips the tag check and builds what it's run on.
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Twice, from two checkouts, and the two must be the same byte for
      # byte; anyone can run the same script at the tag and compare.
      - name: Package the crate twice and compare
        run: scripts/package-twice.sh HEAD dist | tee dist.sha256
      - run: mv dist.sha256 dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To create the release and attach the files.
      contents: write
      # To sign the build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: dist
      # Signed provenance for the crate, checkable with
      # `gh attestation verify FILE --repo parsec-html/parsec`; the bundle is
      # attached to the release too (see SECURITY.md).
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.crate
      - run: cp "$BUNDLE" "dist/parsec-${GITHUB_REF_NAME}.intoto.jsonl"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Parsec ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
